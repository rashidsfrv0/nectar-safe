# Builds nectar.exe (portable, unsigned) on a GitHub-hosted Windows runner.
# Needs no secrets and no local tooling. Run it from the repo's "Actions" tab
# (Build portable exe -> Run workflow), or it runs automatically on every push to main.
name: Build portable exe

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # --frozen-lockfile: install exactly the versions pinned in bun.lock.
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # --no-bundle: build only nectar.exe (no installer, no signing key needed).
      # --locked: use exactly the versions pinned in src-tauri/Cargo.lock.
      # If this step ever fails complaining about Cargo.lock, remove "-- --locked".
      - name: Build
        run: bun run tauri build --no-bundle -- --locked

      - name: Collect output and hash
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item src-tauri/target/release/nectar.exe out/nectar.exe
          $hash = (Get-FileHash out/nectar.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  nectar.exe" | Out-File -Encoding ascii out/SHA256.txt
          "### nectar.exe SHA-256`n`n$hash" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: nectar-portable-windows-x64
          path: out/
          retention-days: 30
